version: '3.8'
services:
  app:
    build:
      context: ./
    container_name: laravel_app
    volumes:
      - .:/var/www/html
    environment:      
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=ids-database
      - DB_USERNAME=root
      - DB_PASSWORD=705203
    depends_on:
      - db
    networks:
      - laravel_network
  webserver:
      image: nginx:alpine
      container_name: nginx_webserver
      ports:
        - "80:80"
      volumes:
        - .:/var/www/html
        - ./nginx.conf:/etc/nginx/conf.d/default.conf
      depends_on:
        - app
      networks:
        - laravel_network
  db:
    image: mysql:8.0
    container_name: mysql_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ids-database
      MYSQL_ROOT_PASSWORD: 705203
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel_network

networks:
  laravel_network:
    driver: bridge

volumes:
  db_data:
